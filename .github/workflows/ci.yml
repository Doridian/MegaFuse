name: CI

# What can be checked without a ROM: the 68000 decoder against gas (every
# encoding it accepts must assemble back to the same bytes) and that the
# Python tools parse.  The matching builds need a baserom and run locally
# (README, "Build").

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo add-apt-repository -y universe  # the m68k binutils live there
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu python3

      - name: Decoder against gas
        run: make test CROSS=m68k-linux-gnu-

      - name: Python tools parse
        run: python3 -m py_compile tools/*.py
