[package]
name = "net"
version = "0.1.0"
description = "Network play for MegaFuse: transports and the lockstep session"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["matchbox"]
# The WebRTC transport (matchbox).  Without it only the in-memory
# transport is there.
matchbox = ["dep:matchbox_socket", "dep:tokio", "dep:wasm-bindgen-futures"]

[dependencies]
matchbox_socket = { version = "0.15", optional = true }

# Natively the socket's message loop runs on a thread of its own, on a
# small tokio runtime; the browser build spawns it with
# wasm-bindgen-futures.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53", features = ["rt", "time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[lints]
workspace = true
