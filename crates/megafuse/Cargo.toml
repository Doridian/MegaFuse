[package]
name = "megafuse"
version = "0.1.0"
description = "Mega Bomberman in Rust (MegaFuse)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The exact build (crates/game's `exact`): `make exact`.
exact = ["game/exact"]

[dependencies]
game = { path = "../game" }
md = { path = "../md" }
platform = { path = "../platform" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
net = { path = "../net" }
# The file dialog that asks for the ROM when it isn't given (rom.rs):
# natively only, the browser's page asks for it itself.
rfd = "0.18"

# The Windows executable's icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The browser build (docs/web.md, tools/build-web.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[lints]
workspace = true
